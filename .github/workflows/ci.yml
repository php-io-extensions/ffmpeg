name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on macos-15
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        ts: [nts, zts]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Install FFmpeg
        run: brew install ffmpeg pkgconf

      - name: Build
        run: |
          phpize
          ./configure --enable-ffmpeg
          make -j"$(sysctl -n hw.ncpu)"

      - name: Load
        run: |
          php -n -d extension="$PWD/modules/ffmpeg.so" -r 'exit(extension_loaded("ffmpeg") ? 0 : 1);'
          php -n -d extension="$PWD/modules/ffmpeg.so" --ri ffmpeg

  # Ubuntu 24.04 ships FFmpeg 6.1, below the 7.1 floor; Debian trixie ships the floor itself.
  trixie:
    name: PHP 8.4 nts on debian:trixie (FFmpeg 7.1)
    runs-on: ubuntu-24.04
    container: debian:trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP and FFmpeg
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config php8.4-cli php8.4-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Build
        run: |
          phpize
          ./configure --enable-ffmpeg
          make -j"$(nproc)"

      - name: Load
        run: |
          php -n -d extension="$PWD/modules/ffmpeg.so" -r 'exit(extension_loaded("ffmpeg") ? 0 : 1);'
          php -n -d extension="$PWD/modules/ffmpeg.so" --ri ffmpeg
